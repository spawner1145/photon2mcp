import groovy.json.JsonSlurper

plugins { id 'java-library' }
version = '0.2.0'
group = 'dev.photonmcp'
base { archivesName = 'photon-mcp-neoforge-26.2' }
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }

def instanceDir = file(gameDir)
def minecraftDir = instanceDir.parentFile.parentFile
def metadata = new JsonSlurper().parse(file("${instanceDir}/${instanceDir.name}.json"))
def libraryFiles = metadata.libraries.collect { library ->
    def artifactPath = library.downloads?.artifact?.path
    artifactPath ? new File(minecraftDir, "libraries/${artifactPath}") : null
}.findAll { artifact -> artifact != null && artifact.exists() }
libraryFiles.add(file("${instanceDir}/${instanceDir.name}.jar"))
libraryFiles.addAll(fileTree(new File(minecraftDir, 'libraries/net/neoforged/neoforge/26.2.0.88')) { include '*-universal.jar' }.files)
libraryFiles.addAll(fileTree(new File(instanceDir, 'mods')) { include '*.jar' }.files)
def extractLibraries = tasks.register('extractLocalLibraries', Sync) {
    from(fileTree(new File(instanceDir, 'mods')) { include '*.jar' }.collect { zipTree(it) }) {
        include 'META-INF/jarjar/*.jar'
    }
    into layout.buildDirectory.dir('local-libraries')
}

dependencies {
    implementation files(new File(gradle.gradleHomeDir, 'lib/groovy-4.0.28.jar'))
    implementation files(libraryFiles)
    compileOnly files(fileTree(layout.buildDirectory.dir('local-libraries')) { include '**/*.jar' }).builtBy(extractLibraries)
    testImplementation files('build/tooling/junit-platform-console-standalone-1.10.0.jar')
}
jar {
    from(new File(gradle.gradleHomeDir, 'lib/groovy-4.0.28.jar')) { into 'META-INF/jarjar' }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-proc:none'] }
test {
    useJUnitPlatform()
    classpath += files(fileTree(layout.buildDirectory.dir('local-libraries')) { include '**/*.jar' })
}
tasks.register('installMod', Copy) {
    dependsOn jar
    from tasks.jar.archiveFile
    into new File(instanceDir, 'mods')
}
