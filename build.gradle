plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '0.2.2'
group = 'dev.photonmcp'
base { archivesName = 'photon-mcp-neoforge-1.21.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }

repositories { mavenCentral() }

def installedMods = file("${gameDir}/mods")
def installedJar = { String artifact, String artifactVersion ->
    def suffix = "${artifact}-neoforge-1.21.1-${artifactVersion}-all.jar"
    def matches = installedMods.listFiles()?.findAll { it.isFile() && it.name.endsWith(suffix) } ?: []
    if (matches.size() != 1) {
        throw new GradleException("Expected exactly one installed ${suffix}, found ${matches.size()} in ${installedMods}")
    }
    matches.first()
}
def photonJar = installedJar('photon', photon_version)
def ldlibJar = installedJar('ldlib2', ldlib2_version)
def extractCompileLibraries = tasks.register('extractCompileLibraries', Sync) {
    from(zipTree(ldlibJar)) { include 'META-INF/jarjar/*.jar' }
    from(zipTree(photonJar)) { include 'META-INF/jarjar/*.jar' }
    into layout.buildDirectory.dir('compile-libraries')
}

neoForge {
    version = '21.1.252'
    mods {
        photon_mcp { sourceSet sourceSets.main }
    }
    runs {
        client {
            client()
            gameDirectory = file('run')
        }
    }
}

configurations { embeddedGroovy }
configurations.implementation.extendsFrom(configurations.embeddedGroovy)
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
dependencies {
    embeddedGroovy 'org.apache.groovy:groovy:4.0.28'
    implementation files(photonJar, ldlibJar)
    compileOnly files(fileTree(layout.buildDirectory.dir('compile-libraries')) { include '**/*.jar' }).builtBy(extractCompileLibraries)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}
jar { from(configurations.embeddedGroovy) { into 'META-INF/jarjar' } }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test {
    useJUnitPlatform()
    systemProperty 'photonMcp.photonJar', photonJar.absolutePath
    systemProperty 'photonMcp.ldlibJar', ldlibJar.absolutePath
    classpath += files(photonJar, ldlibJar)
    classpath += files(fileTree(layout.buildDirectory.dir('compile-libraries')) { include '**/*.jar' })
}

tasks.register('installMod') {
    dependsOn jar
    inputs.file tasks.jar.archiveFile
    outputs.file tasks.jar.archiveFileName.map { name -> new File(installedMods, name) }
    outputs.upToDateWhen { false }
    doLast {
        def gamePath = file(gameDir).canonicalPath.replace('\\', '/').toLowerCase(Locale.ROOT)
        def runningGame = ProcessHandle.allProcesses().filter { process ->
            def info = process.info()
            def command = info.command().orElse('').toLowerCase(Locale.ROOT)
            def arguments = info.commandLine().orElse('').replace('\\', '/').toLowerCase(Locale.ROOT)
            (command.endsWith('java.exe') || command.endsWith('javaw.exe')) && arguments.contains(gamePath)
        }.findAny()
        if (runningGame.present) throw new GradleException('Close this Minecraft instance before replacing the MCP mod')
        def previousMods = fileTree(installedMods) {
            include 'photon-mcp-neoforge-1.21.1-*.jar'
        }.files
        if (!previousMods.empty) {
            def backupDir = layout.buildDirectory.dir("install-backups/${new Date().format('yyyyMMdd-HHmmss-SSS')}").get().asFile
            copy {
                from previousMods
                into backupDir
            }
            previousMods.each { oldJar ->
                if (!oldJar.delete()) throw new GradleException("Cannot replace installed MCP mod: ${oldJar}")
            }
            logger.lifecycle("Previous MCP mods backed up to ${backupDir}")
        }
        copy {
            from tasks.jar.archiveFile
            into installedMods
        }
    }
}
